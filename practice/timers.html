<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        div{
            height: 200px;
            text-align: center;
            background-color: #750975;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            border: 5px solid rgb(24, 24, 65);
            color: white;
            margin-top: 15px;

        }
        nav{
            height: 50px;
            background-color:rgb(23, 23, 77);
            color:rgb(178, 124, 25) ;
            margin: 0;
            text-align: center;

        }
        h2{
            margin-top: 5px;
        }
        h4{
            margin-top: 15px;
        }
        
    </style>
</head>
<body>
    <nav>
       <h1> India Time Zone</h1>
    </nav>
    <div>
        <h1>India</h1>
        <h2>Asia/kolkata</h2>
        <h4 id="date">Date</h4>
        <h4 id="time">Time</h4>
    </div>


<!-- script area -->
<script>
    let dateEle=document.getElementById('date');
    let timeEle=document.getElementById('time');

    function timers(){
        let d=new Date();
        let currentDate=d.toLocaleDateString();
        dateEle.innerText=currentDate;
        let currentTime=d.toLocaleTimeString();
        timeEle.innerText=currentTime;
    }
    setInterval(timers,1000);
</script>

</body>
</html>
