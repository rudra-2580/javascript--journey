<!DOCTYPE html>
<html lang="en">
<head>
    <title>Products</title>
    <style>
        .row{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:20px;
            padding:20px;
        }
        .card{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }
        img{
            width:100%;
            height:150px;
            object-fit:contain;
        }
        button{
            padding:4px 10px;
            margin:5px;
        }
    </style>
</head>
<body>

<div class="row" id="product-row"></div>


<script>
    let obj1 = {
        id:101,
        pName:"Watch",
        imgurl:"./../DOM/electronics (1).png",
        price:14000,
        rating:4.8,
        qty:1
    };

    let obj2 = {
        id:102,
        pName:"Iphone",
        imgurl:"./../DOM/electronics (1).png",
        price:99999,
        rating:4.6,
        qty:1
    };

    let obj3 = {
        id:103,
        pName:"Ipad",
        imgurl:"./../DOM/electronics (1).png",
        price:49999,
        rating:4.5,
        qty:1
    };

    let obj4 = {
        id:104,
        pName:"Mac",
        imgurl:"./../DOM/electronics (1).png",
        price:49500,
        rating:4.9,
        qty:1
    };

    let items = [obj1,obj2,obj3,obj4];

    function displayproducts(products){
        let eachproduct = "";

        for(let obj of products){
            eachproduct += `
                <div class="card">
                    <img src="${obj.imgurl}">
                    <h2>${obj.pName}</h2>
                    <h4>₹${obj.price}</h4>
                    <h5>⭐ ${obj.rating}</h5>
                    <button onclick="decqty(${obj.id})">➖</button>
                    <span id="qty-${obj.id}">${obj.qty}</span>
                    <button onclick="incqty(${obj.id})">➕</button>
                </div>
            `;
        }

        document.getElementById("product-row").innerHTML = eachproduct;
    }
    function incqty(id){
        let product = items.find(p => p.id === id);
        product.qty++;
        displayproducts(items);
    }

    
    function decqty(id){
        let product = items.find(p => p.id === id);
        if(product.qty > 1){
            product.qty--;
        } else {
            product.qty = 1;
        }
        displayproducts(items);
    }

    displayproducts(items);
</script>

</body>
</html>
