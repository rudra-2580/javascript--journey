<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
          height: 400px;
          width: 600px;
          margin: auto;
          border: 2px solid black;
        }
        button{
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div></div>

    <button onclick="changeCol()">ChangeColor</button>


    <!-- scrpt area -->

    <script>
     let div_tag=document.querySelector('div');
     function changeCol(){
        let r=Math.trunc(Math.random()*255+1);
        let g=Math.trunc(Math.random()*255+1);
        let b=Math.trunc(Math.random()*255+1);

        console.log(r,g,b);
        

        div_tag.style.backgroundColor=`rgb(${r},${g},${b})`;

     }
    </script>
</body>
</html>
