<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Add Event Listener</h1>
    <button id="btn">click</button>
    

    <script>
        let btn_ele=document.getElementById('btn')
        btn_ele.addEventListener('click',change_tittle)
        function change_tittle(){
            document.title='add event listener';
        }
    </script>
</body>
</html>
